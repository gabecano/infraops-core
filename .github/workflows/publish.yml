name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Configure Poetry repository
        run: |
          poetry config repositories.github "https://maven.pkg.github.com/${{ github.repository }}"
          poetry config http-basic.github "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}"
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build package
        run: poetry build
      - name: Publish package
        run: poetry publish -r github
